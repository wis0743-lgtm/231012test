<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>우리반 진로노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: 하늘색 종이 바탕 위 둥근 파스텔 카드. 학생=2열(기록 | 분석), 교사=탭 + 학생 카드 그리드. 휴대폰에서는 1열로 쌓임 */
:root{
  --paper:#f4f8fc; --surface:#ffffff; --surface-2:#eef4fa; --ink:#22314a; --ink-2:#56667f; --line:#dbe5ef;
  --sky:#d8ebfa; --sky-ink:#1d5c8c; --mint:#dff2d6; --mint-ink:#386a26; --pink:#fbe0ea; --pink-ink:#963457;
  --butter:#fff0c0; --butter-ink:#735400; --accent:#3a7fc0; --accent-ink:#ffffff; --danger:#c03d48;
  --shadow:0 1px 2px rgba(34,49,74,.05),0 8px 22px rgba(34,49,74,.07);
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121924; --surface:#1b2431; --surface-2:#222d3c; --ink:#e6edf6; --ink-2:#a2b0c3; --line:#2e3a4b;
  --sky:#1d3850; --sky-ink:#a8d2f4; --mint:#223e28; --mint-ink:#b4e0a1; --pink:#44263a; --pink-ink:#f3b4cb;
  --butter:#3f381b; --butter-ink:#f1da8c; --accent:#6aa8df; --accent-ink:#0d1926; --danger:#ef7d87;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121924; --surface:#1b2431; --surface-2:#222d3c; --ink:#e6edf6; --ink-2:#a2b0c3; --line:#2e3a4b;
  --sky:#1d3850; --sky-ink:#a8d2f4; --mint:#223e28; --mint-ink:#b4e0a1; --pink:#44263a; --pink-ink:#f3b4cb;
  --butter:#3f381b; --butter-ink:#f1da8c; --accent:#6aa8df; --accent-ink:#0d1926; --danger:#ef7d87;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.1rem;line-height:1.2} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.5em 1.05em;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:.4em;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--sky);color:var(--sky-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:.3em .8em;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:4px} .field>span{font-size:.82rem;color:var(--ink-2);font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:.55em .75em;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:.3em;padding:.12em .65em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.sky{background:var(--sky);color:var(--sky-ink)} .tag.mint{background:var(--mint);color:var(--mint-ink)}
.tag.pink{background:var(--pink);color:var(--pink-ink)} .tag.butter{background:var(--butter);color:var(--butter-ink)}
.tag .x{border:0;background:none;padding:0 0 0 2px;color:inherit;font-weight:700;line-height:1}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:conic-gradient(var(--sky) 0 25%,var(--mint) 0 50%,var(--pink) 0 75%,var(--butter) 0);display:inline-block}
.who{font-weight:600;color:var(--ink-2)}
.grow{flex:1}
/* start */
.start{min-height:80vh;display:grid;place-items:center}
.start .hero{max-width:720px;width:100%;display:grid;gap:22px;padding-block:40px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.role{border:0;text-align:left;border-radius:var(--r-lg);padding:24px;display:grid;gap:8px;box-shadow:var(--shadow);transition:transform .15s}
.role:hover{transform:translateY(-2px)}
.role.s{background:var(--sky);color:var(--sky-ink)} .role.t{background:var(--mint);color:var(--mint-ink)}
.role b{font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.ribbon{display:flex;gap:6px} .ribbon span{height:8px;flex:1;border-radius:4px}
/* student layout */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:1fr}}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.subjects{display:flex;flex-wrap:wrap;gap:6px}
/* chat */
.chat{background:var(--surface-2);border-radius:var(--r-md);padding:14px;display:grid;gap:10px;max-height:520px;overflow:auto}
.bubble{max-width:88%;padding:.6em .9em;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.bubble.bot{background:var(--surface);border-top-left-radius:4px;justify-self:start}
.bubble.me{background:var(--sky);color:var(--sky-ink);border-top-right-radius:4px;justify-self:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35em .85em;font-size:.88rem;font-weight:600}
.chip:hover{background:var(--sky);color:var(--sky-ink);border-color:transparent}
.chipgroup{display:grid;gap:4px} .chipgroup>span{font-size:.75rem;color:var(--ink-2);font-weight:700}
.composer{display:grid;gap:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r-md);padding:16px;text-align:center;color:var(--ink-2);background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--sky)}
.att{display:grid;gap:6px;padding:10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.att .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.att .name{font-weight:600;word-break:break-all;min-width:0;flex:1}
/* activity cards */
.acts{display:grid;gap:10px}
.act{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:grid;gap:6px;background:var(--surface)}
.act .t{font-weight:700}
.act .body{color:var(--ink-2);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act.full .body{display:block;-webkit-line-clamp:unset;white-space:pre-wrap}
/* analysis */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.stats{grid-template-columns:1fr}}
.stat{border-radius:var(--r-md);padding:12px;display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.stat.a{background:var(--sky);color:var(--sky-ink)} .stat.b{background:var(--mint);color:var(--mint-ink)} .stat.c{background:var(--butter);color:var(--butter-ink)}
.stat .l{font-size:.78rem;font-weight:700}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.li{border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);display:grid;gap:4px}
.li.good{border-left:4px solid var(--mint-ink)} .li.gap{border-left:4px solid var(--pink-ink)} .li.tip{border-left:4px solid var(--butter-ink)}
.notice{font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.fb{background:var(--pink);color:var(--pink-ink);border-radius:var(--r-md);padding:14px;display:grid;gap:8px}
.fb p{white-space:pre-wrap;color:var(--ink)}
.empty{padding:18px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r-md)}
/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:.45em 1em;border-radius:999px;font-weight:700;color:var(--ink-2)}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.scard{border:0;text-align:left;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px;display:grid;gap:6px;align-content:start}
.scard:hover{outline:2px solid var(--sky)}
.scard .n{font-family:var(--f-display);font-size:1.15rem}
.scard.none{background:transparent;box-shadow:none;border:1px dashed var(--line);color:var(--ink-2);cursor:default}
.scard.none:hover{outline:0}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.86rem}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.memo{background:var(--butter);color:var(--butter-ink);border-radius:var(--r-md);padding:12px;display:grid;gap:6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--ink-2);letter-spacing:.04em}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,25,40,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6em 1.1em;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.err{color:var(--danger);font-size:.86rem}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.print-only{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  .topbar,.no-print,.toast,.overlay{display:none!important}
  .print-only{display:block}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .cols{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

/* =========================================================
   1. 기본 데이터 (PRD 4.4, 4.5)

const APP_ID = "uriban-jinro-note";
const TEACHER_PW = "1234";
const DEFAULT_SUBJECTS = ["공통국어1","공통국어2","공통수학1","공통수학2","공통영어1","공통영어2","한국사1","한국사2","통합사회1","통합사회2","통합과학1","통합과학2","과학탐구실험1","과학탐구실험2"];

];
const CREATIVE_AREAS = [{type:"자율·자치활동",short:"자율·자치",key:"auto"},{type:"동아리활동",short:"동아리",key:"club"},{type:"진로활동",short:"진로",key:"career"}];
const groupOf = t => (ACT_GROUPS.find(g => g.types.includes(t)) || {group:"기타"}).group;
const FILE_MAX = 10*1024*1024, STUDENT_MAX = 50*1024*1024;

const FIELDS = {
  "인문":{kw:["문학","역사","철학","언어","글쓰기","비평","고전","번역","인물","문화","해석","토론","독서","사상"],
    subj:["공통국어","공통영어","한국사","통합사회"], rec:["보고서","발표·토론","독서","진로활동"],
    ideas:{"공통국어":"작품 하나를 골라 시대 배경과 함께 비평문을 써 보세요.","공통영어":"영어 원문 글을 직접 번역하고 번역하며 고민한 점을 정리해 보세요.","한국사":"관심 있는 인물이나 사건을 사료 중심으로 탐구한 보고서를 써 보세요.","통합사회":"문화 다양성이나 정의 단원과 연결한 인문학 토론을 해 보세요."},
    auto:"학급 독서 캠페인이나 학급 신문 기획처럼 글과 생각을 나누는 자치활동을 해 보세요.",club:"독서토론·문예·역사 탐구 동아리에서 주제 발표를 맡아 보세요.",career:"인문 계열 학과 탐색이나 작가·학자 인터뷰 같은 진로활동을 기록해 보세요.",topic:"고전 다시 읽기, 언어와 문화"},
  "사회":{kw:["사회","정책","법","정치","인권","불평등","설문","통계","지역","시민","언론","갈등","제도","복지"],
    subj:["통합사회","한국사","공통국어","공통수학"], rec:["보고서","발표·토론","자율·자치활동","진로활동"],
    ideas:{"통합사회":"지역 문제 하나를 골라 원인과 정책 대안을 정리한 보고서를 써 보세요.","한국사":"제도나 사회 변화가 오늘날에 남긴 영향을 탐구해 보세요.","공통국어":"시사 쟁점을 다룬 논설문을 쓰거나 토론 활동을 해 보세요.","공통수학":"설문 결과를 통계로 정리해 사회 현상을 해석해 보세요."},
    auto:"학급 규칙 만들기, 학생자치 제안처럼 공동체 문제를 해결하는 활동을 해 보세요.",club:"시사토론·모의재판·사회참여 동아리에서 쟁점 조사를 맡아 보세요.",career:"공공기관·언론사 탐방이나 사회 계열 학과 탐색 활동을 기록해 보세요.",topic:"지역 문제 조사, 청소년 정책"},
  "경영·경제":{kw:["경제","경영","시장","소비","기업","금융","마케팅","수요","공급","창업","통계","데이터","투자","브랜드"],
    subj:["통합사회","공통수학","공통영어","정보"], rec:["보고서","발표·토론","동아리활동","진로활동"],
    ideas:{"통합사회":"시장과 금융 단원을 바탕으로 생활 속 경제 현상을 분석해 보세요.","공통수학":"가격 변화나 소비 데이터를 함수와 그래프로 해석해 보세요.","공통영어":"해외 기업 사례 기사를 읽고 요약해 발표해 보세요.","정보":"판매·설문 데이터를 스프레드시트나 코딩으로 분석해 보세요."},
    auto:"학급 행사 예산 짜기나 바자회 운영처럼 실제 경제 활동을 해 보세요.",club:"경제·창업 동아리에서 모의 창업이나 마케팅 기획을 해 보세요.",career:"기업 탐방, 경영·경제 학과 탐색, 직업인 인터뷰를 기록해 보세요.",topic:"소비자 행동, 지역 상권 분석"},

/* =========================================================
   2. 규칙 기반 분석 (한 곳에 모음 — 나중에 AI 분석으로 교체)
   입력: 학생 데이터(JSON) / 출력: 분석 결과. 같은 입력이면 같은 결과.
   ========================================================= */
const Analyzer = {
  version: "rules-1",
  activityText(a){
    const files = (a.files||[]).map(f => [f.text, f.summary, f.desc].filter(Boolean).join(" ")).join(" ");
    return [a.title, a.did, a.learned, files].filter(Boolean).join(" ");
  },
  familyOf(subject, families){
    const s = (subject||"").replace(/\s/g,"");
    return families.find(f => s.includes(f.replace(/\s/g,""))) || null;
  },
  analyze(st){
    const F = FIELDS[st.field];
    const acts = st.activities || [];
    const gaps = [], strengths = [];
    if(!st.field) gaps.push({code:"input", label:"희망 계열이 비어 있어요", detail:"계열을 골라야 전공 연계 분석을 할 수 있어요.", tip:"‘내 진로’에서 희망 계열을 선택하세요."});
    if(!(st.subjects||[]).length) gaps.push({code:"input", label:"이수 과목을 입력하지 않았어요", detail:"이수(이수 중) 과목을 추가하면 관련 교과 분석이 더 정확해져요.", tip:"‘이수 과목’에서 지금 듣는 과목을 모두 추가하세요."});
    const creative = {};
    CREATIVE_AREAS.forEach(c => creative[c.short] = acts.some(a => a.type === c.type));
    if(!F){
      CREATIVE_AREAS.forEach(c => { if(!creative[c.short]) gaps.push({code:"creative", label:`창체 ‘${c.short}’ 영역 기록이 없어요`, detail:"창의적 체험활동 3개 영역을 고르게 채우면 좋아요.", tip:`${c.short} 활동을 하나 기록해 보세요.`}); });
      return {field:null, summary:{linked:0, coverage:0, families:[], covered:[], creative}, strengths, gaps, version:this.version};
    }
    // 관련 교과 중 학생에게 해당하는 것(이수 과목 + 기본 과목에 있는 것). 없으면 전체.
    const pool = [...(st.subjects||[]), ...DEFAULT_SUBJECTS];
    let families = F.subj.filter(f => pool.some(s => this.familyOf(s,[f])));
    if(!families.length) families = F.subj.slice();
    let linked = 0, withFollow = 0;
    const covered = new Set();
    acts.forEach(a => {
      const text = this.activityText(a);
      const kws = F.kw.filter(k => text.includes(k));
      const fam = this.familyOf(a.subject, F.subj);
      if(fam && families.includes(fam)) covered.add(fam);
      const hasFollow = (a.learned||"").trim().length >= 10;
      if(kws.length) linked++;
      if(hasFollow) withFollow++;
      const score = (kws.length?1:0) + (fam?1:0) + (hasFollow?1:0);
      if(score >= 2) strengths.push({id:a.id, title:a.title, type:a.type, subject:a.subject, score, kws, fam, hasFollow, rec:F.rec.includes(a.type)});
    });
    strengths.sort((x,y) => y.score-x.score || y.kws.length-x.kws.length || (y.rec?1:0)-(x.rec?1:0) || (x.title||"").localeCompare(y.title||"","ko"));
    families.filter(f => !covered.has(f)).forEach(f => gaps.push({code:"subject", label:`관련 교과 ‘${f}’ 활동 기록이 없어요`, detail:`${st.field} 계열과 관련 있는 교과예요.`, tip:F.ideas[f] || `${f} 수업에서 ${st.field} 계열과 이어지는 주제로 보고서나 발표를 해 보세요.`}));
    CREATIVE_AREAS.forEach(c => { if(!creative[c.short]) gaps.push({code:"creative", label:`창체 ‘${c.short}’ 영역 기록이 없어요`, detail:"자율·자치, 동아리, 진로 3개 영역을 고르게 채우면 좋아요.", tip:F[c.key]}); });
    if(linked < 2) gaps.push({code:"keyword", label:`전공 연계 활동이 ${linked}건이에요 (2건 이상 권장)`, detail:`활동 내용에 ${st.field} 계열 핵심어가 드러난 활동이 적어요.`, tip:`‘${F.topic}’ 같은 주제로 탐구해 보고, 기록할 때 ${F.kw.slice(0,4).join(", ")} 같은 핵심 내용을 구체적으로 적어 보세요.`});
    if(withFollow === 0) gaps.push({code:"deep", label:"후속 탐구로 이어진 활동이 없어요", detail:"‘배운 점·후속 탐구’가 쓰인 활동이 없어 심화가 부족해 보여요.", tip:"기존 활동 하나를 골라 더 알고 싶은 점을 정하고, 심화 보고서·추가 실험·관련 독서로 이어 가세요."});
    return {field:st.field, summary:{linked, coverage: Math.round(covered.size / families.length * 100), families, covered:[...covered], creative}, strengths, gaps, version:this.version};
  }
};

let memFiles = new Map(); // IndexedDB를 못 쓸 때 대비
const IDB = {
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise(res => {
      try{
        const r = indexedDB.open("jn-files", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("files");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      }catch{ res(null); }
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    if(!db) return fn(null);
    return new Promise((res) => {
      try{
        const t = db.transaction("files", mode); const s = t.objectStore("files");
        const out = fn(s);
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
        t.onerror = () => res(null);
      }catch{ res(null); }
    });
  },
  async put(key, val){ const db = await this.open(); if(!db){ memFiles.set(key,val); return; } return this.tx("readwrite", s => s.put(val, key)); },
  async get(key){ const db = await this.open(); if(!db) return memFiles.get(key)||null; return this.tx("readonly", s => s.get(key)); },
  async del(key){ const db = await this.open(); if(!db){ memFiles.delete(key); return; } return this.tx("readwrite", s => s.delete(key)); },
  async keys(){ const db = await this.open(); if(!db) return [...memFiles.keys()]; return this.tx("readonly", s => s.getAllKeys()); },
  async delPrefix(p){ const ks = (await this.keys())||[]; for(const k of ks) if(String(k).startsWith(p)) await this.del(k); }
};

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function modal(html, onMount){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(o);
  const close = () => o.remove();
  o.addEventListener("click", e => { if(e.target === o) close(); });
  o.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
  onMount && onMount(o.firstElementChild, close);
  const f = o.querySelector("input,textarea,select,button.primary"); f && f.focus();
  return close;
}

function pickFiles({accept="", multiple=false}={}){
  return new Promise(res => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = accept; inp.multiple = multiple; inp.className = "hidden-input";
    document.body.append(inp);
    inp.onchange = () => { res([...inp.files]); inp.remove(); };
    inp.click();
  });
}
const readText = f => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f, "utf-8"); });
const blobToDataURL = b => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function dataURLToBlob(u){ const r = await fetch(u); return r.blob(); }
function dataURLToBlobSync(u){
  const [h, b64] = u.split(","); const mime = (h.match(/data:([^;]+)/)||[])[1] || "application/octet-stream";
  const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* 파일 저장: claude.ai 안에서는 downloads 기능, 일반 브라우저에서는 바로 내려받기 */
let dlNS;
async function saveFile(filename, data, mime="application/json"){
  if(window.claude && typeof window.claude.use === "function"){
    if(dlNS === undefined){ try{ dlNS = await window.claude.use("downloads"); }catch{ dlNS = null; } }
    if(dlNS){
      try{ await dlNS.save({filename, data}); toast(`‘${filename}’을(를) 저장했어요`); return true; }
      catch(e){
        if(e && e.code === "declined"){ toast("저장을 취소했어요"); return false; }
        if(e && e.code === "rate_limited"){ toast("저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요."); return false; }
        if(e && e.code === "rejected_extension"){ toast("이 형식의 파일은 여기서 저장할 수 없어요"); return false; }
      }
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.rel = "noopener";
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast(`‘${filename}’ 내려받기를 시작했어요`);
  return true;
}

/* PDF 글자 추출 */
async function extractPdfText(file){
  if(!window.pdfjsLib) return "";
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
    let out = "";
    for(let i=1; i<=Math.min(pdf.numPages, 40); i++){
      const p = await pdf.getPage(i); const c = await p.getTextContent();
      out += c.items.map(it => it.str).join(" ") + "\n";
      if(out.length > 20000) break;
    }
    return out.replace(/\s+/g," ").trim().slice(0, 20000);
  }catch(e){ return ""; }
}

function actCard(a, editable, full=false, owner="s"){
  const g = groupOf(a.type);
  const tone = g==="교과" ? "sky" : g==="창체" ? "mint" : "butter";
  const files = (a.files||[]);
  return `<article class="act ${full?"full":""}">
    <div class="row" style="gap:6px"><span class="tag ${tone}">${esc(g)} · ${esc(a.type)}</span>${a.subject ? `<span class="tag">${esc(a.subject)}</span>` : ""}<span class="grow"></span><span class="small muted num">${fmtDate(a.createdAt)}</span></div>
    <div class="t">${esc(a.title)}</div>
    <div class="body">${esc(a.did)}</div>
    ${full && a.learned ? `<div class="small"><b>배운 점·후속 탐구</b><div class="body" style="display:block;white-space:pre-wrap">${esc(a.learned)}</div></div>` : (!full ? `<div class="small muted">${a.learned ? "✓ 후속 탐구 작성" : "후속 탐구 미작성"}</div>` : "")}
    ${files.length ? `<div class="thumbs" data-thumbs="${owner}" data-act-id="${esc(a.id)}"></div>
      <div class="row" style="gap:6px">${files.map(f => `<button class="tag" data-act="open-file" data-owner="${owner}" data-aid="${esc(a.id)}" data-fid="${esc(f.id)}" style="border:0">${f.mime==="application/pdf"?"PDF":"이미지"} · ${esc(f.name)}</button>`).join("")}</div>` : ""}
    ${full ? files.filter(f => f.summary || f.desc || f.text).map(f => `<details class="small"><summary>${esc(f.name)} 분석용 내용</summary><p class="muted" style="white-space:pre-wrap">${esc((f.summary||f.desc||"") + (f.text ? "\n[추출 텍스트] " + f.text.slice(0,600) + (f.text.length>600?"…":"") : ""))}</p></details>`).join("") : ""}
    ${editable ? `<div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sm" data-act="edit-act" data-id="${esc(a.id)}">수정</button><button class="btn sm danger" data-act="del-act" data-id="${esc(a.id)}">삭제</button></div>` : ""}
  </article>`;
}

      <div class="stat a"><span class="l">전공 연계 활동</span><span class="v num">${sm.linked}건</span></div>
      <div class="stat b"><span class="l">관련 교과 커버율</span><span class="v num">${a.field ? sm.coverage + "%" : "—"}</span><div class="meter" style="background:var(--surface)"><i style="width:${sm.coverage}%;background:var(--mint-ink)"></i></div></div>
      <div class="stat c"><span class="l">창체 영역</span><span class="v num">${filled}/3</span></div>
    </div>
    <div class="row" style="gap:6px">${cre}${a.field ? ` <span class="small muted">관련 교과: ${sm.families.map(f => `${sm.covered.includes(f) ? "●" : "○"} ${esc(f)}`).join(" · ")}</span>` : ""}</div>
    <div style="display:grid;gap:8px"><h3>유리한 활동 <span class="muted num">${a.strengths.length}</span></h3>
      ${a.strengths.length ? `<ul class="list">${a.strengths.map(s => `<li class="li good">
        <div class="row" style="gap:6px"><b>${esc(s.title)}</b><span class="tag">${esc(s.type)}</span><span class="grow"></span><span class="small muted">충족 ${s.score}/3</span></div>
        <div class="row" style="gap:6px">${s.kws.length ? `<span class="tag sky">핵심어: ${s.kws.map(esc).join(", ")}</span>` : ""}${s.fam ? `<span class="tag mint">관련 교과: ${esc(s.fam)}</span>` : ""}${s.hasFollow ? `<span class="tag butter">후속 탐구 ✓</span>` : ""}${s.rec ? `<span class="tag pink">권장 활동 유형</span>` : ""}</div></li>`).join("")}</ul>`
        : `<p class="small muted">아직 조건을 2개 이상 만족하는 활동이 없어요. 핵심어, 관련 교과, 후속 탐구 중 2가지 이상을 갖추면 여기에 표시돼요.</p>`}
    </div>
    <div style="display:grid;gap:8px"><h3>부족한 부분 <span class="muted num">${a.gaps.length}</span></h3>
      ${a.gaps.length ? `<ul class="list">${a.gaps.map(g => `<li class="li gap"><b>${esc(g.label)}</b><span class="small muted">${esc(g.detail)}</span></li>`).join("")}</ul>` : `<p class="small muted">눈에 띄게 부족한 부분이 없어요.</p>`}
    </div>
    ${tips.length ? `<div style="display:grid;gap:8px"><h3>다음 활동 제안</h3><ul class="list">${tips.map(g => `<li class="li tip small">${esc(g.tip)}</li>`).join("")}</ul></div>` : ""}
    <p class="notice">이 결과는 입력한 내용에 따른 자동 분석이며, 최종 판단은 담임 선생님 상담을 통해 확인하세요.</p>`;
}

/* ---------- 채팅식 활동 입력 (S-4, S-5) ---------- */
const CHAT_Q = [
  "어떤 활동을 기록할까요? 활동 유형을 골라 주세요.",
  "관련 과목은 무엇인가요?",
  "활동 제목을 알려 주세요. (예: 자유낙하 실험으로 중력가속도 구하기)",
  "무엇을 했는지 구체적으로 적어 주세요. 주제, 방법, 내가 맡은 역할을 넣으면 좋아요.",
  "이 활동으로 배운 점이나 더 탐구해 보고 싶은 점이 있나요? 없으면 건너뛰어도 돼요.",
  "보고서·발표 자료(PDF)나 사진(JPG, PNG)이 있으면 첨부해 주세요. 없으면 바로 저장하세요.",
];
function newChat(){ return {step:0, draft:{}, files:[], log:[{who:"bot", text:"안녕하세요! 활동 1건을 차례대로 기록해 볼게요.\n" + CHAT_Q[0]}]}; }
function mountChat(){
  if(!state.chat) state.chat = newChat();
  const c = state.chat, st = getStudent();
  const box = $("#chatBox"); if(!box) return;
  let input = "";
  if(c.step === 0){
    input = ACT_GROUPS.map(g => `<div class="chipgroup"><span>${g.group === "창체" ? "창의적 체험활동" : g.group}</span><div class="chips">${g.types.map(t => `<button class="chip" data-act="chat-pick" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`).join("");
  } else if(c.step === 1){
    const isCh = groupOf(c.draft.type) !== "교과";
    const mine = st.subjects.length ? st.subjects : subjectList();
    input = `<div class="chips">${isCh ? `<button class="chip" data-act="chat-pick" data-v="">해당 과목 없음</button>` : ""}${mine.map(s => `<button class="chip" data-act="chat-pick" data-v="${esc(s)}">${esc(s)}</button>`).join("")}${!isCh ? `<button class="chip" data-act="chat-pick" data-v="">해당 과목 없음</button>` : ""}</div>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="chatIn" placeholder="목록에 없으면 직접 입력"><button class="btn primary" data-act="chat-send">보내기</button></div>`;
  } else if(c.step === 2){
    input = `<div class="row" style="flex-wrap:nowrap"><input type="text" id="chatIn" maxlength="80" placeholder="활동 제목"><button class="btn primary" data-act="chat-send">보내기</button></div>`;
  } else if(c.step === 3 || c.step === 4){
    input = `<textarea id="chatIn" rows="4" placeholder="${c.step===3 ? "예: 모둠에서 실험 설계를 맡아 낙하 높이를 바꿔 가며 시간을 측정했다…" : "예: 공기 저항을 줄이는 방법이 궁금해져 다음에는 물체 모양을 바꿔 실험해 보고 싶다…"}"></textarea>
      <div class="row" style="justify-content:flex-end">${c.step===4 ? `<button class="btn" data-act="chat-skip">건너뛰기</button>` : ""}<button class="btn primary" data-act="chat-send">보내기</button></div>`;
  } else if(c.step === 5){
    input = attachEditor(c.files, "chat") + `<p class="err" id="chatErr" hidden></p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="chat-save">활동 저장하기</button></div>`;
  }
  box.innerHTML = `<div class="chat" aria-live="polite">${c.log.map(m => `<div class="bubble ${m.who}">${esc(m.text)}</div>`).join("")}</div><div class="composer" style="margin-top:10px">${input}</div>`;
  const ch = box.querySelector(".chat"); ch.scrollTop = ch.scrollHeight;
  const inp = $("#chatIn"); if(inp && c.touched) inp.focus({preventScroll:true});
  if(c.step === 5) wireDrop(box, c.files, () => mountChat());
}
function chatAnswer(val, shown){
  const c = state.chat;
  const keys = ["type","subject","title","did","learned"];
  if(c.step >= 2 && c.step <= 3 && !String(val).trim()){ toast(c.step===2 ? "제목을 입력해 주세요" : "활동 내용을 입력해 주세요"); return; }
  c.touched = true;
  c.draft[keys[c.step]] = String(val).trim();
  c.log.push({who:"me", text: shown ?? (val || "해당 과목 없음")});
  c.step++;
  c.log.push({who:"bot", text: CHAT_Q[c.step]});
  mountChat();
}

/* 첨부 편집기 (채팅 / 수정 창 공용) */
function attachEditor(files, ctx){
  return `<div class="drop" data-drop="${ctx}" tabindex="0" role="button" aria-label="파일 첨부">PDF 또는 이미지(JPG, PNG)를 끌어다 놓거나 <b>눌러서 선택</b>하세요<br><span class="small">파일당 10MB까지 · 여러 개 가능</span></div>
  ${files.map((f,i) => `<div class="att">
    <div class="top"><span class="tag ${f.mime==="application/pdf"?"sky":"mint"}">${f.mime==="application/pdf"?"PDF":"이미지"}</span><span class="name">${esc(f.name)}</span><span class="small muted num">${fmtSize(f.size)}</span>
    <button class="btn sm danger" data-act="att-rm" data-ctx="${ctx}" data-i="${i}">빼기</button></div>
    ${f.status === "reading" ? `<span class="small muted">글자를 읽는 중…</span>` : ""}
    ${f.mime==="application/pdf" && f.status !== "reading" ? (f.text && f.text.length >= 30 ? `<span class="small muted">본문 글자 ${f.text.length.toLocaleString()}자를 읽었어요. 분석에 사용해요.</span>` :
      `<label class="field"><span style="color:var(--pink-ink)">글자를 읽지 못한 PDF예요(스캔본 등). 내용을 2~3줄로 요약해 주세요.</span><textarea rows="2" data-att-sum="${ctx}" data-i="${i}">${esc(f.summary||"")}</textarea></label>`) : ""}
    ${f.mime!=="application/pdf" ? `<label class="field"><span>사진 설명 (분석에 사용돼요)</span><input type="text" data-att-desc="${ctx}" data-i="${i}" value="${esc(f.desc||"")}" placeholder="예: 완성한 센서 회로 사진"></label>` : ""}
  </div>`).join("")}`;
}
function wireDrop(root, files, rerender){
  const d = root.querySelector(".drop"); if(!d) return;
  const add = async list => {
    const st = getStudent(); let used = totalBytes(st) + files.reduce((n,f) => n + f.size, 0);
    for(const file of list){
      const okType = /^(application\/pdf|image\/(jpeg|png))$/.test(file.type) || /\.(pdf|jpe?g|png)$/i.test(file.name);
      if(!okType){ toast(`‘${file.name}’은(는) PDF·JPG·PNG가 아니라서 올릴 수 없어요`); continue; }
      if(file.size > FILE_MAX){ toast(`‘${file.name}’이(가) 10MB를 넘어요. 용량을 줄여 다시 올려 주세요`); continue; }
      used += file.size;
      if(used > STUDENT_MAX) toast("첨부 합계가 권장 한도(50MB)를 넘었어요. 제출 파일이 커질 수 있어요");
      const mime = file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : /\.png$/i.test(file.name) ? "image/png" : "image/jpeg");
      const f = {id:uid(), name:file.name, mime, size:file.size, blob:file, status: mime==="application/pdf" ? "reading" : "ok", text:"", summary:"", desc:""};
      files.push(f); rerender();
      if(mime === "application/pdf"){ f.text = await extractPdfText(file); f.status = "ok"; rerender(); }
    }
  };
  d.onclick = async () => add(await pickFiles({accept:".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png", multiple:true}));
  d.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); d.click(); } };
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); add([...e.dataTransfer.files]); };
}
function validateFiles(files){
  if(files.some(f => f.status === "reading")) return "PDF 글자를 읽는 중이에요. 잠시만 기다려 주세요.";
  const miss = files.find(f => f.mime === "application/pdf" && !(f.text && f.text.length >= 30) && !(f.summary||"").trim());
  if(miss) return `‘${miss.name}’의 요약을 2~3줄 입력해 주세요.`;
  return "";
}
async function storeFiles(files){
  const out = [];
  for(const f of files){
    if(f.blob) await IDB.put("s:"+f.id, {blob:f.blob, name:f.name, mime:f.mime});
    out.push({id:f.id, name:f.name, mime:f.mime, size:f.size, text:(f.text && f.text.length>=30) ? f.text : "", summary:(f.summary||"").trim(), desc:(f.desc||"").trim()});
  }
  return out;
}

/* 썸네일 */
const urlCache = new Map();
async function fileURL(key){
  if(urlCache.has(key)) return urlCache.get(key);
  const rec = await IDB.get(key); if(!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob); urlCache.set(key, u); return u;
}
async function hydrateThumbs(prefixFn){
  for(const el of document.querySelectorAll("[data-thumbs]")){
    const aid = el.dataset.actId; const owner = el.dataset.thumbs;
    const acts = owner === "s" ? getStudent().activities : (getTeacher().students[state.detailNo]?.activities || []);
    const a = acts.find(x => x.id === aid); if(!a) continue;
    for(const f of a.files.filter(f => f.mime.startsWith("image/"))){
      const u = await fileURL(prefixFn(owner, f.id)); if(!u) continue;
      const img = document.createElement("img"); img.src = u; img.alt = f.desc || f.name; el.append(img);
    }
  }
}
const keyFor = (owner, fid) => owner === "s" ? "s:"+fid : `t:${state.detailNo}:${fid}`;
const hydrateStudentThumbs = () => hydrateThumbs(keyFor);
const hydrateTeacherThumbs = () => hydrateThumbs(keyFor);
async function openFile(owner, aid, fid){
  const key = keyFor(owner, fid);
  const rec = await IDB.get(key);
  if(!rec){ toast("이 기기에서 파일을 찾지 못했어요"); return; }
  const u = await fileURL(key);
  const isImg = (rec.mime||"").startsWith("image/");
  modal(`<div class="card-h"><h3 style="word-break:break-all">${esc(rec.name)}</h3><button class="btn sm ghost" data-x>닫기</button></div>
    ${isImg ? `<img src="${u}" alt="${esc(rec.name)}" style="border-radius:12px;max-height:60vh;object-fit:contain;width:100%">` : `<p class="muted small">PDF는 새 탭에서 열거나 저장해서 보세요.</p>`}
    <div class="row" style="justify-content:flex-end"><a class="btn" href="${u}" target="_blank" rel="noopener">새 탭에서 열기</a><button class="btn primary" data-dl>파일 저장</button></div>`,
  (m, close) => { m.querySelector("[data-x]").onclick = close; m.querySelector("[data-dl]").onclick = () => saveFile(rec.name, rec.blob, rec.mime); });
}

/* 제출 파일 (S-8) */
async function buildSubmission(){
  const st = getStudent();
  const files = {};
  for(const a of st.activities) for(const f of a.files){
    const rec = await IDB.get("s:"+f.id);
    if(rec && rec.blob) files[f.id] = await blobToDataURL(rec.blob);
  }
  const {feedback, ...rest} = st;
  return {app:APP_ID, type:"submission", version:1, exportedAt:today(), student:rest, files};
}

  </div>`;
}

/* 학생 파일 불러오기 (T-1) */
async function importStudents(files){
  const T = getTeacher(); let ok = 0, skip = 0; const bad = [];
  const parsed = [];
  for(const f of files){
    try{ const j = JSON.parse(await readText(f)); if(j.app !== APP_ID || j.type !== "submission" || !j.student) throw 0; parsed.push(j); }
    catch{ bad.push(f.name); }
  }
  parsed.sort((x,y) => (x.exportedAt||"").localeCompare(y.exportedAt||""));
  for(const j of parsed){
    const s = j.student; const no = String(parseInt(s.no,10));
    if(!no || no === "NaN"){ bad.push(`${s.name||"이름 없음"}(번호 없음)`); continue; }
    const prev = T.students[no];
    if(prev && prev.submittedAt && prev.submittedAt > j.exportedAt){ skip++; continue; }
    await IDB.delPrefix(`t:${no}:`);
    for(const [fid, url] of Object.entries(j.files||{})){
      const meta = s.activities.flatMap(a => a.files).find(x => x.id === fid) || {};
      try{ await IDB.put(`t:${no}:${fid}`, {blob:dataURLToBlobSync(url), name:meta.name||fid, mime:meta.mime||""}); }catch{}
    }
    T.students[no] = {...s, no, activities:s.activities||[], subjects:s.subjects||[], submittedAt:j.exportedAt, importedAt:today()};
    if(+no > T.total) T.total = +no;
    ok++;
  }
  urlCache.clear();
  saveTeacher(T); render();
  toast(`${ok}명 반영${skip ? ` · 더 오래된 파일 ${skip}개 건너뜀` : ""}${bad.length ? ` · 읽지 못한 파일 ${bad.length}개` : ""}`);
  if(bad.length) modal(`<h3>읽지 못한 파일</h3><p class="small muted">우리반 진로노트 제출 파일(.json)이 아니거나 손상된 파일이에요.</p><ul>${bad.map(b => `<li>${esc(b)}</li>`).join("")}</ul><div class="row" style="justify-content:flex-end"><button class="btn primary" data-x>확인</button></div>`, (m,c) => m.querySelector("[data-x]").onclick = c);
}
function feedbackItem(T, no){
  const s = T.students[no]; const f = T.feedback[no] || {};
  return {no, name:s?.name||"", strength:f.strength||"", recommend:f.recommend||"", updatedAt:f.updatedAt||today()}; // 상담 메모 제외
}
async function exportFeedbackAll(){
  const T = getTeacher();
  const nos = Object.keys(T.students).filter(n => { const f = T.feedback[n]; return f && (f.strength || f.recommend); });
  if(!nos.length){ toast("학생에게 보낼 피드백(보완 방향·추천 활동)이 아직 없어요"); return; }
  modal(`<h2>피드백 내보내기</h2><p class="muted small">학생에게 보낼 피드백이 있는 학생은 <b class="num">${nos.length}명</b>이에요. 상담 메모는 포함되지 않아요.</p>
    <div style="display:grid;gap:8px">
      <button class="btn primary" data-zip style="justify-content:center">학생별 파일 묶음(.zip) 저장</button>
      <span class="small muted">압축을 풀면 학생마다 파일이 하나씩 있어요. 각 학생에게 자기 파일만 보내 주세요.</span>
      <button class="btn" data-one style="justify-content:center">학급 전체 1개 파일 저장 (교사 보관용)</button>
    </div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x>닫기</button></div>`,
  (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-one]").onclick = () => { close(); saveFile(`진로노트_피드백_학급전체_${ymd()}.json`, JSON.stringify({app:APP_ID, type:"feedback", version:1, exportedAt:today(), classLabel:T.classLabel, items:nos.map(n => feedbackItem(T,n))}, null, 1)); };
    m.querySelector("[data-zip]").onclick = async () => {
      close();
      if(!window.JSZip){ toast("압축 도구를 불러오지 못했어요. 학생 상세 화면에서 한 명씩 내보내 주세요"); return; }
      const z = new JSZip();
      nos.forEach(n => { const it = feedbackItem(T,n); z.file(`피드백_${n}번_${it.name}.json`, JSON.stringify({app:APP_ID, type:"feedback", version:1, exportedAt:today(), items:[it]}, null, 1)); });
      saveFile(`진로노트_피드백_학생별_${ymd()}.zip`, await z.generateAsync({type:"blob"}), "application/zip");
    };
  });
}

/* =========================================================
   9. 백업·복원 (C-3)
   ========================================================= */
async function backupAll(){
  const ls = {}; LS.keys().forEach(k => ls[k] = LS.get(k));
  const files = {};
  for(const k of (await IDB.keys())||[]){ const r = await IDB.get(k); if(r && r.blob) files[k] = {name:r.name, mime:r.mime, at:r.at, data:await blobToDataURL(r.blob)}; }
  await saveFile(`진로노트_기기백업_${ymd()}.json`, JSON.stringify({app:APP_ID, type:"backup", version:1, exportedAt:today(), ls, files}));
}
async function restoreAll(file){
  try{
    const j = JSON.parse(await readText(file));
    if(j.app !== APP_ID || j.type !== "backup") throw 0;
    confirmBox("백업 파일로 복원할까요?", "지금 이 기기에 있는 진로노트 자료는 백업 파일 내용으로 바뀌어요.", "복원하기", async () => {
      LS.keys().forEach(k => LS.del(k)); await IDB.delPrefix("");
      Object.entries(j.ls||{}).forEach(([k,v]) => LS.set(k,v));
      for(const [k, r] of Object.entries(j.files||{})) await IDB.put(k, {blob:dataURLToBlobSync(r.data), name:r.name, mime:r.mime, at:r.at});
      urlCache.clear(); toast("복원했어요"); state.view = "start"; render();
    });
  }catch{ toast("진로노트 백업 파일이 아니에요. 파일을 확인해 주세요"); }
}

      const before = base.length; lines.forEach(x => { if(!base.includes(x)) base.push(x); });
      LS.set(K.curriculum, base); render(); toast(act === "curr-paste" ? `${base.length - before}과목을 더했어요` : `${base.length}과목으로 바꿨어요`); break;
    }

  }
});
async function addCounsel(fs){
  if(!fs || !fs.length) return;
  const T = getTeacher(); T.counsel = T.counsel || [];
  for(const f of fs){
    const id = uid(); await IDB.put("c:"+id, {blob:f, name:f.name, mime:f.type, at:today()});
    T.counsel.unshift({id, name:f.name, mime:f.type, size:f.size, at:today(), memo:""});
  }
  saveTeacher(T); render(); toast(`${fs.length}개 자료를 올렸어요`);
}
document.addEventListener("change", e => {
  const t = e.target;
  const k = t.dataset.change;
  if(k === "field" || k === "major"){ const s = getStudent(); s[k] = t.value.trim(); saveStudent(s); if(k === "field") render(); }
  if(k === "sort"){ state.sort = t.value; render(); }
  if(k === "filter"){ state.filter = t.value; render(); }
  if(t.dataset.counselMemo){ const T = getTeacher(); const c = T.counsel.find(x => x.id === t.dataset.counselMemo); if(c){ c.memo = t.value; saveTeacher(T); toast("메모를 저장했어요"); } }
  if(t.dataset.currEdit !== undefined){ const l = subjectList().slice(); const v = t.value.trim(); if(!v) { render(); return; } l[+t.dataset.currEdit] = v; LS.set(K.curriculum, [...new Set(l)]); render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.attSum === "chat") state.chat.files[+t.dataset.i].summary = t.value;
  if(t.dataset.attDesc === "chat") state.chat.files[+t.dataset.i].desc = t.value;
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "chatIn" && e.target.tagName === "INPUT"){ e.preventDefault(); $("[data-act=chat-send]")?.click(); }
  if(e.key === "Enter" && e.target.id === "currAdd"){ e.preventDefault(); $("[data-act=curr-add]")?.click(); }
  if(e.key === "Enter" && e.target.id === "setupName"){ e.preventDefault(); $("[data-act=setup-save]")?.click(); }
});
/* 상담 자료실 드래그 앤 드롭 */
document.addEventListener("dragover", e => { const d = e.target.closest?.("[data-drop=counsel]"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest?.("[data-drop=counsel]"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("[data-drop=counsel]"); if(d){ e.preventDefault(); addCounsel([...e.dataTransfer.files]); } });
document.addEventListener("click", async e => { const d = e.target.closest("[data-drop=counsel]"); if(d) addCounsel(await pickFiles({multiple:true})); });

/* 시작: 같은 기기 학생은 자동으로 이어서 */
if(getStudent()) state.view = "student";
render();
</script>
</body>
</html>
